<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a12">
<title>Character Choice — Statistiques communautaires</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Styles spécifiques à cette page (complément de style.css) */
  .community-wrap{max-width:1200px;margin:36px auto;padding:0 18px 40px}
  .community-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  .community-header h1{margin:0;font-size:clamp(22px,3.5vw,36px)}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .controls input[type="search"]{background:#0e1122;color:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:220px}
  .controls select{background:#0e1122;color:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px}
  
  .stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:14px;
    margin-top:18px;
    perspective:1000px;
    width:100%;
    auto-rows: min-content;
  }
  
  .stat-card{
    position:relative;
    background:rgba(18,21,40,.86);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px;
    display:flex;
    gap:10px;
    align-items:center;
    cursor:pointer;
    transition:all .28s ease;
    overflow:visible;
    transform-origin:center;
  }
  .stat-card:hover{
    border-color:var(--accent);
    box-shadow:0 0 30px rgba(248,216,74,.35),inset 0 0 20px rgba(248,216,74,.08);
    z-index:100;
    transform:scale(1.08) translateZ(0);
    position:relative;
  }
  
  .ranking-position{min-width:34px;font-size:18px;font-weight:1000;color:var(--muted);text-align:center;flex-shrink:0}
  .ranking-position-1{color:#f8d84a}
  .ranking-position-2{color:#cfd5e8}
  .ranking-position-3{color:#d89062}
  
  .portrait{
    width:64px;height:80px;flex:0 0 64px;border-radius:6px;
    background:#0b0d1a;display:flex;align-items:center;justify-content:center;
    overflow:hidden;transition:all .28s ease;
  }
  .stat-card:hover .portrait{
    transform:scale(1.15);
    border-radius:8px;
  }
  .portrait img{width:100%;height:100%;object-fit:cover;display:block}
  
  .stat-info{
    flex:1;min-width:0;transition:all .28s ease;
  }
  .stat-info .name{
    font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-size:14px;transition:all .28s ease;
  }
  .stat-card:hover .stat-info .name{
    font-size:16px;color:var(--accent);
  }
  
  .stat-row{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    margin-top:8px;color:var(--muted);font-weight:800;font-size:13px;
    transition:all .28s ease;opacity:0.7;
  }
  .stat-card:hover .stat-row{
    opacity:1;font-size:14px;
  }
  .stat-row .badge{
    background:rgba(255,255,255,.03);
    padding:4px 8px;border-radius:8px;font-weight:900;color:#fff;
    transition:all .2s ease;border:1px solid rgba(255,255,255,.1);
  }
  .stat-card:hover .stat-row .badge{
    background:rgba(248,216,74,.15);
    border-color:rgba(248,216,74,.4);
    color:#f8d84a;
  }
  .stat-row .badge.elo-rank{
    color:#f8d84a;background:rgba(248,216,74,.08);
  }
  .stat-card:hover .stat-row .badge.elo-rank{
    background:rgba(248,216,74,.25);color:#fff;text-shadow:0 0 10px rgba(248,216,74,.6);
  }

  .hover-details{
    position:fixed;
    background:rgba(12,14,26,.98);
    border:1px solid rgba(248,216,74,.35);
    border-radius:10px;
    padding:14px 16px;
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
    opacity:0;
    pointer-events:none;
    transition:all .25s ease;
    box-shadow:0 12px 28px rgba(0,0,0,.5);
    min-width:200px;
    backdrop-filter:blur(8px);
  }
  .hover-details.active{
    opacity:1;
    pointer-events:auto;
  }
  .hover-detail{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    font-size:12px;
    color:var(--muted);
    font-weight:800;
    min-height:20px;
  }
  .hover-detail strong{
    color:#fff;
    font-size:13px;
  }
  .hover-detail .icon{
    color:var(--accent);
    font-size:13px;
  }

  .no-stats{color:var(--muted);padding:20px;text-align:center}
  .loading{color:var(--muted);padding:18px}
  .metric-display{background:rgba(18,21,40,.86);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:18px;text-align:center;display:none}
  .metric-display.active{display:block}
  .metric-display h3{margin:0 0 10px;color:var(--accent);font-size:28px}
  .metric-display p{color:var(--muted);margin:0}
  .elo-rank{color:#f8d84a;font-weight:900}
  
  @media(max-width:700px){
    .community-header{align-items:flex-start}
    .controls{width:100%}
    .controls input[type="search"]{min-width:0;width:100%}
    .stats-grid{grid-template-columns:1fr;gap:10px}
    .stat-card{padding:10px;transform:none !important}
    .stat-card:hover{transform:none !important}
    .stat-card:hover .portrait{transform:none}
    .stat-card:hover .stat-info .name{font-size:14px}
    .portrait{width:56px;height:68px;flex:0 0 56px}
    .hover-details{min-width:180px;padding:12px 14px}
  }
</style>
</head>
<body>
<div class="site-header">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">🌍</div>
      <div class="brand-copy">
        <div class="eyebrow">COMMUNITY STATS</div>
        <h1>Statistiques de la communauté</h1>
      </div>
    </div>
    <div class="actions">
      <a href="index.html" class="secondary nav-link">🏆 Tournoi</a>
      <a href="stats.html" class="secondary nav-link">📊 Statistiques</a>
    </div>
  </header>
</div>

<main class="community-wrap">
  <div class="community-header">
    <div>
      <div class="eyebrow">MÉTRIQUES GLOBALES</div>
      <h1>Classement communautaire</h1>
    </div>

    <div class="controls" role="region" aria-label="Contrôles de recherche et tri">
      <input id="search" type="search" placeholder="Rechercher un personnage…" aria-label="Rechercher un personnage">
      <select id="sort" aria-label="Trier par">
        <option value="elo">Trier par : Elo — meilleur d'abord</option>
        <option value="wins">Trier par : victoires — plus grand nombre</option>
        <option value="fights">Trier par : combats — plus grand nombre</option>
        <option value="winRate">Trier par : taux de victoire — meilleur d'abord</option>
        <option value="name">Trier par : nom — A à Z</option>
      </select>
      <select id="metric" aria-label="Afficher une métrique spéciale">
        <option value="ranking">Classement général</option>
        <option value="topWins">Personnage le plus victorieux</option>
        <option value="topRate">Meilleur taux de victoire</option>
      </select>
    </div>
  </div>

  <div id="status" class="loading">Chargement…</div>

  <div id="metricTopWins" class="metric-display">
    <div class="eyebrow">Personnage le plus victorieux</div>
    <h3 id="topWinsName">—</h3>
    <p id="topWinsDetail">—</p>
  </div>

  <div id="metricTopRate" class="metric-display">
    <div class="eyebrow">Meilleur taux de victoire</div>
    <h3 id="topRateName">—</h3>
    <p id="topRateDetail">—</p>
  </div>

  <div id="grid" class="stats-grid" aria-live="polite"></div>
</main>

<div id="hoverDetailsContainer"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="characters.js"></script>

<script>
const statusEl = document.getElementById("status");
const gridEl = document.getElementById("grid");
const searchEl = document.getElementById("search");
const sortEl = document.getElementById("sort");
const metricEl = document.getElementById("metric");
const hoverDetailsContainer = document.getElementById("hoverDetailsContainer");

const metricTopWins = document.getElementById("metricTopWins");
const metricTopRate = document.getElementById("metricTopRate");
const topWinsNameEl = document.getElementById("topWinsName");
const topWinsDetailEl = document.getElementById("topWinsDetail");
const topRateNameEl = document.getElementById("topRateName");
const topRateDetailEl = document.getElementById("topRateDetail");

let rows = [];
let mapped = [];

function safeNumber(v){ return Number(v) >= 0 ? Number(v) : 0; }

function getCharacterArray(){
  if (typeof CHARACTERS !== "undefined" && Array.isArray(CHARACTERS)) return CHARACTERS;
  if (window && window.CHARACTERS && Array.isArray(window.CHARACTERS)) return window.CHARACTERS;
  return [];
}

function getCharacterById(id){
  const arr = getCharacterArray();
  return arr.find(c => String(c.id) === String(id));
}

function slugify(s){
  return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/['']/g,"").replace(/[^a-zA-Z0-9]+/g,"_").replace(/^_+|_+$/g,"").toLowerCase();
}

function getImageCandidates(item){
  const id = String(item.id || item.characterId || "");
  const name = String(item.name || item.displayName || "").trim();
  const names = [];
  if(name) names.push(name);
  if(name) names.push(slugify(name));
  const candidates = [];
  if(id) candidates.push(`images/${id}.jpg`, `images/${id}.jpeg`, `images/${id}.JPG`, `images/${id}.JPEG`);
  for(const n of names){
    if(n) candidates.push(`images/${id}_${n}.jpg`, `images/${id}_${n}.jpeg`, `images/${n}.jpg`, `images/${n}.jpeg`);
  }
  candidates.push(`images/${id}_portrait.jpg`, `images/${id}_thumb.jpg`);
  return [...new Set(candidates)];
}

function createPortraitElement(item){
  const container = document.createElement("div");
  container.className = "portrait";
  const img = document.createElement("img");
  img.alt = item.displayName || item.name || item.id || "";
  const candidates = getImageCandidates(item);
  let i = 0;
  img.onerror = () => {
    i++;
    if(i < candidates.length) img.src = candidates[i];
    else {
      container.textContent = (item.displayName || item.name || item.id || "").slice(0,1).toUpperCase();
      container.style.fontWeight = "900";
      container.style.color = "#fff";
      container.style.fontSize = "20px";
      container.style.background = "linear-gradient(180deg,#0f1530,#081024)";
    }
  };
  if(candidates.length){
    img.src = candidates[0];
    container.appendChild(img);
  } else {
    container.textContent = (item.displayName || item.name || item.id || "").slice(0,1).toUpperCase();
  }
  return container;
}

function computeDerived(item){
  const wins = Number(item.wins || 0);
  const lossesExists = Object.prototype.hasOwnProperty.call(item, "losses");
  const losses = lossesExists ? Number(item.losses || 0) : null;
  let fights = null;
  if (Object.prototype.hasOwnProperty.call(item, "fights")) fights = Number(item.fights || 0);
  else if (losses !== null) fights = wins + losses;
  else if (wins) fights = wins;
  const winRate = (fights && fights > 0) ? Math.round((wins / fights) * 100) : null;
  const elo = Number(item.elo || 1600);
  return { wins: safeNumber(wins), losses: losses !== null ? Math.max(0, losses) : null, fights: fights !== null ? Math.max(0, fights) : null, winRate, elo };
}

function getEloRank(elo) {
  if (elo >= 2400) return "🏆 Légende";
  if (elo >= 2000) return "👑 Maître";
  if (elo >= 1800) return "⭐ Expert";
  if (elo >= 1600) return "💎 Compétent";
  if (elo >= 1400) return "🎯 Confirmé";
  if (elo >= 1200) return "📈 Débutant+";
  return "🌱 Novice";
}

function createHoverDetailsPanel(item) {
  const panel = document.createElement("div");
  panel.className = "hover-details";

  const detailWins = document.createElement("div");
  detailWins.className = "hover-detail";
  detailWins.innerHTML = '<span class="icon">🏆</span><span>Victoires</span><strong>' + (item.wins ?? 0) + '</strong>';
  panel.appendChild(detailWins);

  const detailLosses = document.createElement("div");
  detailLosses.className = "hover-detail";
  detailLosses.innerHTML = '<span class="icon">💀</span><span>Défaites</span><strong>' + (item.losses ?? 0) + '</strong>';
  panel.appendChild(detailLosses);

  const detailElo = document.createElement("div");
  detailElo.className = "hover-detail";
  detailElo.innerHTML = '<span class="icon">📊</span><span>Elo</span><strong>' + (item.elo ?? 1600) + '</strong>';
  panel.appendChild(detailElo);

  const detailFights = document.createElement("div");
  detailFights.className = "hover-detail";
  detailFights.innerHTML = '<span class="icon">⚔️</span><span>Combats</span><strong>' + (item.fights ?? 0) + '</strong>';
  panel.appendChild(detailFights);

  return panel;
}

function positionHoverPanel(card, panel) {
  const rect = card.getBoundingClientRect();
  const panelWidth = 220;
  const panelHeight = 140;
  
  let left = rect.left + rect.width / 2 - panelWidth / 2;
  let top = rect.bottom + 8;
  
  if (left < 0) left = 8;
  if (left + panelWidth > window.innerWidth) left = window.innerWidth - panelWidth - 8;
  if (top + panelHeight > window.innerHeight) top = rect.top - panelHeight - 8;
  
  panel.style.left = left + "px";
  panel.style.top = top + "px";
}

function renderGrid(list){
  gridEl.innerHTML = "";
  if(!list.length){
    gridEl.innerHTML = '<div class="no-stats">Aucun résultat.</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  for(const [index, item] of list.entries()){
    const card = document.createElement("article");
    card.className = "stat-card";

    const ranking = document.createElement("div");
    ranking.className = `ranking-position ranking-position-${item.globalPosition <= 3 ? item.globalPosition : 'other'}`;
    ranking.textContent = `#${item.globalPosition}`;
    card.appendChild(ranking);

    const portrait = createPortraitElement(item);
    card.appendChild(portrait);

    const info = document.createElement("div");
    info.className = "stat-info";

    const nameEl = document.createElement("div");
    nameEl.className = "name";
    nameEl.title = item.displayName || item.name || item.id || "";
    nameEl.textContent = item.displayName || item.name || item.id || "";
    info.appendChild(nameEl);

    const statsRow = document.createElement("div");
    statsRow.className = "stat-row";

    const eloBadge = document.createElement("div");
    eloBadge.className = "badge elo-rank";
    eloBadge.textContent = `📊 ${item.elo}`;
    eloBadge.title = getEloRank(item.elo);
    statsRow.appendChild(eloBadge);

    const winsBadge = document.createElement("div");
    winsBadge.className = "badge";
    winsBadge.textContent = `🏆 ${item.wins}`;
    statsRow.appendChild(winsBadge);

    if (item.losses !== null && item.losses !== undefined) {
      const lossesBadge = document.createElement("div");
      lossesBadge.className = "badge";
      lossesBadge.textContent = `💀 ${item.losses}`;
      statsRow.appendChild(lossesBadge);
    }

    if (item.fights !== null && item.fights !== undefined) {
      const fightsBadge = document.createElement("div");
      fightsBadge.className = "badge";
      fightsBadge.textContent = `⚔️ ${item.fights}`;
      statsRow.appendChild(fightsBadge);
    }

    if (item.winRate !== null && item.winRate !== undefined) {
      const rateBadge = document.createElement("div");
      rateBadge.className = "badge";
      rateBadge.textContent = `${item.winRate}%`;
      statsRow.appendChild(rateBadge);
    }

    info.appendChild(statsRow);
    card.appendChild(info);

    const panel = createHoverDetailsPanel(item);
    
    card.addEventListener("mouseenter", () => {
      hoverDetailsContainer.innerHTML = "";
      hoverDetailsContainer.appendChild(panel);
      panel.classList.add("active");
      positionHoverPanel(card, panel);
    });

    card.addEventListener("mouseleave", () => {
      panel.classList.remove("active");
      setTimeout(() => {
        if (hoverDetailsContainer.contains(panel)) {
          hoverDetailsContainer.innerHTML = "";
        }
      }, 250);
    });

    frag.appendChild(card);
  }
  gridEl.appendChild(frag);
}

function sortList(list, key){
  const copy = [...list];
  if(key === "elo") return copy.sort((a,b) => (b.elo||1600) - (a.elo||1600) || (b.wins||0) - (a.wins||0) || (a.displayName||"").localeCompare(b.displayName||"","fr"));
  if(key === "wins") return copy.sort((a,b) => (b.wins||0) - (a.wins||0) || (b.fights||0) - (a.fights||0) || (a.displayName||"").localeCompare(b.displayName||"","fr"));
  if(key === "fights") return copy.sort((a,b) => (b.fights||0) - (a.fights||0) || (b.wins||0) - (a.wins||0) || (a.displayName||"").localeCompare(b.displayName||"","fr"));
  if(key === "winRate") return copy.sort((a,b) => (b.winRate||0) - (a.winRate||0) || (b.wins||0) - (a.wins||0) || (a.displayName||"").localeCompare(b.displayName||"","fr"));
  return copy.sort((a,b)=> (a.displayName||"").localeCompare(b.displayName||"","fr"));
}

function applyFiltersAndRender(){
  const q = (searchEl.value || "").trim().toLowerCase();
  let list = [...mapped];
  if(q){
    list = list.filter(item => (item.displayName||"").toLowerCase().includes(q));
  }
  list = sortList(list, sortEl.value);
  renderGrid(list);
}

function getTopWins(){
  return [...mapped].sort((a,b) => (b.wins||0) - (a.wins||0) || (b.fights||0) - (a.fights||0))[0] || null;
}

function getTopRate(){
  return [...mapped].sort((a,b) => (b.winRate||0) - (a.winRate||0) || (b.wins||0) - (a.wins||0))[0] || null;
}

function updateMetricDisplay(){
  const metric = metricEl.value;
  const topWins = getTopWins();
  const topRate = getTopRate();

  metricTopWins.classList.toggle("active", metric === "topWins");
  metricTopRate.classList.toggle("active", metric === "topRate");
  gridEl.style.display = metric === "ranking" ? "grid" : "none";

  if(metric === "topWins" && topWins){
    topWinsNameEl.textContent = topWins.displayName || topWins.name || "—";
    topWinsDetailEl.textContent = `${topWins.wins} victoire${topWins.wins > 1 ? "s" : ""} en ${topWins.fights} combats (Elo: ${topWins.elo})`;
  }

  if(metric === "topRate" && topRate){
    topRateNameEl.textContent = topRate.displayName || topRate.name || "—";
    topRateDetailEl.textContent = `${topRate.winRate}% de victoires — ${topRate.wins} victoires en ${topRate.fights} combats (Elo: ${topRate.elo})`;
  }
}

function loadCommunityStats(){
  if(!window.db){
    statusEl.textContent = "Firebase non disponible.";
    statusEl.className = "danger-box";
    return;
  }
  statusEl.textContent = "Chargement des statistiques…";
  window.db.collection("communityCharacterStats").get()
    .then(snapshot => {
      rows = [];
      snapshot.forEach(doc => {
        const data = doc.data() || {};
        const id = String(data.id || doc.id || "");
        rows.push(Object.assign({}, data, { _docId: doc.id, characterId: id }));
      });

      mapped = rows.map(r => {
        const char = getCharacterById(r.characterId);
        const displayName = r.name || (char && char.name) || (r.characterId || "");
        const derived = computeDerived(r);
        return Object.assign({}, {
          _docId: r._docId,
          id: r.characterId,
          displayName,
          wins: derived.wins,
          losses: derived.losses,
          fights: derived.fights,
          winRate: derived.winRate,
          elo: derived.elo
        }, r);
      });
    
      mapped = sortList(mapped, sortEl.value);
      mapped.forEach((item, index) => {
        item.globalPosition = index + 1;
      });
      
      statusEl.style.display = "none";
      statusEl.className = "";
      applyFiltersAndRender();
      updateMetricDisplay();
    })
    .catch(err => {
      console.error("community: firestore error", err);
      statusEl.textContent = "Impossible de charger les statistiques communautaires.";
      statusEl.className = "danger-box";
    });
}

searchEl.addEventListener("input", () => applyFiltersAndRender());
sortEl.addEventListener("change", () => applyFiltersAndRender());
metricEl.addEventListener("change", updateMetricDisplay);

loadCommunityStats();
</script>
</body>
</html>
